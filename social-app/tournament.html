<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tournament — EyeScout Sports</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sb-data.js"></script>
<style>
  :root {
    --bg: #0a0a0a; --surface: #111; --border: rgba(255,255,255,0.07);
    --grad: linear-gradient(90deg, #7B2FBE 0%, #1E90FF 38%, #00C9A7 70%, #39D353 100%);
    --sidebar-w: 244px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: #fff; font-family: system-ui, -apple-system, sans-serif; min-height: 100vh; display: flex; }
  .sidebar { width: var(--sidebar-w); flex-shrink: 0; position: fixed; top: 0; left: 0; height: 100vh; border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 28px 16px 24px; z-index: 40; background: var(--bg); }
  .nav-links { display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .nav-link { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 12px; cursor: pointer; font-size: 15px; font-weight: 500; color: rgba(255,255,255,0.55); transition: background 0.15s, color 0.15s; text-decoration: none; }
  .nav-link:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.9); }
  .nav-link-icon { width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .new-post-btn { display: flex; align-items: center; gap: 14px; padding: 13px 14px; border-radius: 12px; cursor: pointer; font-size: 15px; font-weight: 700; color: #fff; background: var(--grad); border: none; width: 100%; margin-top: 8px; letter-spacing: 0.02em; box-shadow: 0 4px 20px rgba(123,47,190,0.25); transition: opacity 0.15s, transform 0.15s; }
  .new-post-btn:hover { opacity: 0.88; transform: translateY(-1px); }
  .sidebar-profile { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; cursor: pointer; transition: background 0.15s; border-top: 1px solid var(--border); padding-top: 20px; margin-top: 12px; text-decoration: none; }
  .sidebar-profile:hover { background: rgba(255,255,255,0.04); }
  .sidebar-avatar { width: 38px; height: 38px; border-radius: 50%; padding: 2px; background: var(--grad); flex-shrink: 0; }
  .sidebar-avatar-inner { width: 100%; height: 100%; border-radius: 50%; background: #1a1a1a; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .sidebar-name { font-size: 14px; font-weight: 700; color: #fff; }
  .sidebar-handle { font-size: 12px; color: rgba(255,255,255,0.3); margin-top: 1px; }
  .main { margin-left: var(--sidebar-w); flex: 1; padding: 48px 48px 80px; }
  .post-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
  .post-tile { position: relative; aspect-ratio: 1; overflow: hidden; cursor: pointer; background: #1a1a1a; }
  .post-tile img, .post-tile video { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.2s; }
  .post-tile:hover img, .post-tile:hover video { transform: scale(1.04); }
  .tile-play { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 46px; height: 46px; border-radius: 50%; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; pointer-events: none; padding-left: 3px; }
  .post-tile-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0); display: flex; flex-direction: column; justify-content: flex-end; padding: 12px; transition: background 0.2s; }
  .post-tile:hover .post-tile-overlay { background: rgba(0,0,0,0.55); }
  .post-tile-meta { opacity: 0; transition: opacity 0.2s; font-size: 12px; font-weight: 600; color: #fff; }
  .post-tile:hover .post-tile-meta { opacity: 1; }
  #lightbox { display: none; position: fixed; inset: 0; z-index: 9999; background: rgba(0,0,0,0.92); align-items: center; justify-content: center; }
  #lightbox.open { display: flex; }
  #lb-img, #lb-video { max-width: 80vw; max-height: 80vh; object-fit: contain; border-radius: 4px; }
  #lb-info { position: absolute; bottom: 0; left: 0; right: 0; padding: 24px 32px; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent); }
  #lb-close { position: absolute; top: 20px; right: 24px; width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.1); border: none; cursor: pointer; color: #fff; font-size: 22px; display: flex; align-items: center; justify-content: center; }
  #lb-prev, #lb-next { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.1); border: none; cursor: pointer; color: #fff; font-size: 22px; display: flex; align-items: center; justify-content: center; transition: background 0.15s; }
  #lb-prev:hover, #lb-next:hover { background: rgba(255,255,255,0.2); }
  #lb-prev { left: 20px; }
  #lb-next { right: 20px; }

  /* ── Mobile header (hidden on desktop) ── */
  .mobile-header {
    display: none; position: fixed; top: 0; left: 0; right: 0; height: 56px;
    background: var(--bg); border-bottom: 1px solid var(--border); z-index: 40;
    align-items: center; justify-content: space-between; padding: 0 16px;
  }
  .mobile-logo { height: 38px; width: 38px; object-fit: contain; border-radius: 50%; }
  .mobile-header-title {
    font-family: Impact, 'Arial Narrow', Arial, sans-serif; font-size: 20px;
    letter-spacing: 0.06em; text-transform: uppercase; background: var(--grad);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  /* ── Mobile bottom nav ── */
  .mobile-nav {
    display: none; position: fixed; bottom: 0; left: 0; right: 0; height: 60px;
    background: var(--bg); border-top: 1px solid var(--border); z-index: 40;
    align-items: center; justify-content: space-around; padding: 0 8px;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .mob-nav-btn {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    background: none; border: none; cursor: pointer; color: rgba(255,255,255,0.35);
    padding: 6px 12px; text-decoration: none; font-size: 10px; font-weight: 600;
    letter-spacing: 0.06em; transition: color 0.15s; position: relative;
  }
  .mob-nav-btn.active { color: #fff; }
  .mob-nav-btn svg { display: block; }

  @media (max-width: 768px) {
    .sidebar { display: none; }
    .mobile-header { display: flex; }
    .mobile-nav { display: flex; }
    .main { margin-left: 0 !important; padding: 76px 16px 84px !important; }
    #tournament-title { font-size: 32px !important; }
    .post-grid { gap: 2px !important; }
  }
</style>
</head>
<body>

<nav class="mobile-nav">

  <a class="mob-nav-btn" href="activity.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>Activity</a>
  <a class="mob-nav-btn" href="messages.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Messages</a>

  <a href="feed.html" style="display:flex;justify-content:center;align-items:center;padding:4px 0;margin-bottom:20px;">

  <nav class="nav-links">
    <a class="nav-link" href="feed.html"><span class="nav-link-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>Home</a>
    <a class="nav-link" href="explore.html"><span class="nav-link-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>Search</a>
    <a class="nav-link" href="activity.html"><span class="nav-link-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></span>Activity</a>
    <a class="nav-link" href="messages.html"><span class="nav-link-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>Messages</a>

    <a class="nav-link" href="#" onclick="logout();return false;"><span class="nav-link-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></span>Sign Out</a>
    <button class="new-post-btn" onclick="window.location.href='create-post.html'"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>New Post</button>

</aside>

<main class="main" id="main-content" tabindex="-1">

    <a href="feed.html" style="display:inline-flex;align-items:center;gap:8px;color:rgba(255,255,255,0.35);font-size:13px;text-decoration:none;margin-bottom:20px;transition:color 0.15s;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='rgba(255,255,255,0.35)'">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
      Back to Feed

  <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;">

      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
    </div>
    <p style="font-size:15px;font-weight:600;color:rgba(255,255,255,0.3);margin-bottom:6px;">No posts yet</p>
    <p style="font-size:13px;color:rgba(255,255,255,0.18);">Players haven't posted from this tournament yet.</p>
  </div>
</main>

<!-- Lightbox -->
<div id="lightbox">
  <button id="lb-close" onclick="closeLightbox()" aria-label="Close">×</button>
  <button id="lb-prev" onclick="lbNav(-1)" aria-label="Previous photo">‹</button>
  <img id="lb-img" src="" alt="">
  <video id="lb-video" controls playsinline style="display:none;background:#000;"></video>
  <button id="lb-next" onclick="lbNav(1)" aria-label="Next photo">›</button>
  <div id="lb-info">
    <p id="lb-name" style="font-size:14px;font-weight:700;color:#fff;margin-bottom:3px;"></p>
    <p id="lb-caption" style="font-size:13px;color:rgba(255,255,255,0.55);"></p>
  </div>
</div>

<script>
  function escHtml(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
  var escAttr = escHtml;

  const session = JSON.parse(localStorage.getItem('es_session') || 'null');
  const coachSession = JSON.parse(localStorage.getItem('es_coach_session') || 'null');
  const meId = session?.id || coachSession?.id || null;
  const isCoach = !session && !!coachSession;
  if (!session && !coachSession) window.location.href = 'login.html';

  if (isCoach) {
    // Coaches view the same tournament page — swap in the SAME sidebar they see on
    // every other coach page so navigation stays consistent (not the player sidebar).
    const ic = {
      scout: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>',
      feed:  '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>',
      msg:   '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
      prof:  '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
      set:   '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',
      out:   '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>',
    };
    const item = (href, icon, label, extra = '') => `<a class="nav-link" href="${href}" ${extra}><span class="nav-link-icon">${icon}</span>${label}</a>`;
    const nav = document.querySelector('.nav-links');
    if (nav) nav.innerHTML =
      item('coach-feed.html', ic.scout, 'Scout Players') +
      item('coach-news-feed.html', ic.feed, 'Feed') +
      item('coach-messages.html', ic.msg, 'Messages') +
      item('coach-profile.html', ic.prof, 'My Profile') +
      item('coach-settings.html', ic.set, 'Settings') +
      item('#', ic.out, 'Sign Out', 'onclick="logout();return false;"');
    // Logo + sidebar profile point to coach destinations
    const logo = document.querySelector('.sidebar > a[href="feed.html"]'); if (logo) logo.setAttribute('href', 'coach-news-feed.html');
    const sbProfile = document.querySelector('.sidebar-profile'); if (sbProfile) sbProfile.setAttribute('href', 'coach-profile.html');
    document.getElementById('sb-name').textContent = `${coachSession.firstName || ''} ${coachSession.lastName || ''}`.trim() || 'Coach';
    document.getElementById('sb-handle').textContent = coachSession.sport ? `Coach · ${coachSession.sport}` : 'Coach';
    // Match the coach pages' bottom avatar (blue person-icon circle, or their photo)
    const av = document.querySelector('.sidebar-avatar');
    const inner = document.querySelector('.sidebar-avatar-inner');
    if (av) av.style.background = 'rgba(30,144,255,0.15)';
    if (inner) {
      inner.style.background = 'transparent';
      inner.innerHTML = coachSession.profilePhoto
        ? `<img alt="" src="${coachSession.profilePhoto}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`
        : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(30,144,255,0.7)" stroke-width="1.8" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`;
    }
  } else if (session) {
    document.getElementById('sb-name').textContent = session.athleteFirst + ' ' + session.athleteLast;
    document.getElementById('sb-handle').textContent = '#' + (session.jersey || '—');
  }

  function logout() {
    if (isCoach) { localStorage.removeItem('es_coach_session'); window.location.href = 'coach-login.html'; }
    else { localStorage.removeItem('es_session'); window.location.href = 'login.html'; }
  }

  const params   = new URLSearchParams(window.location.search);
  const tournName = params.get('name') || '';

  const allTournaments = JSON.parse(localStorage.getItem('es_tournaments') || '[]');
  const tourn = allTournaments.find(t => t.name === tournName) || {};

  document.getElementById('tournament-hashtag').textContent = '#' + tournName.replace(/\s+/g, '');
  document.getElementById('tournament-title').textContent   = tournName || 'Tournament';
  document.title = (tournName || 'Tournament') + ' — EyeScout Sports';
  const meta = [tourn.sport, tourn.date, tourn.location].filter(Boolean).join(' · ');
  document.getElementById('tournament-meta').textContent = meta;

  // Tournament page shows every post (photos AND videos) tagged to this tournament.
  function matchPosts() {
    return JSON.parse(localStorage.getItem('es_posts') || '[]')
      .filter(p => (p.type === 'photo' || p.type === 'video') && p.mediaData && p.tournament === tournName);
  }
  let posts = matchPosts();

  function tileHTML(p, i) {
    const prot = (p.authorId && p.authorId === meId) ? '' : 'oncontextmenu="return false" controlslist="nodownload noremoteplayback" disablepictureinpicture';
    const media = p.type === 'video'
      ? `<video src="${escAttr(p.mediaData)}" muted playsinline preload="metadata" ${prot}></video><div class="tile-play"><svg width="24" height="24" viewBox="0 0 24 24" fill="#fff"><polygon points="8 5 19 12 8 19 8 5"/></svg></div>`
      : `<img src="${escAttr(p.mediaData)}" alt="" loading="lazy">`;
    return `
      <div class="post-tile" onclick="openLightbox(${i})">
        ${media}
        <div class="post-tile-overlay">
          <div class="post-tile-meta">
            <p>${escHtml(p.authorName)} · #${escHtml(p.authorJersey || '—')}</p>
            ${p.caption ? `<p style="font-weight:400;opacity:0.7;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escHtml(p.caption)}</p>` : ''}
          </div>
        </div>
      </div>`;
  }

  function renderGrid() {
    document.getElementById('post-count').textContent = posts.length + (posts.length === 1 ? ' post' : ' posts');
    document.getElementById('empty-state').style.display = posts.length ? 'none' : 'block';
    document.getElementById('post-grid').innerHTML = posts.map(tileHTML).join('');
  }
  renderGrid();

  let lbIdx = 0;
  function openLightbox(i) { lbIdx = i; showLb(); document.getElementById('lightbox').classList.add('open'); }
  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
    const v = document.getElementById('lb-video'); if (v) { v.pause(); v.src = ''; }
  }
  function lbNav(dir) { lbIdx = (lbIdx + dir + posts.length) % posts.length; showLb(); }
  function showLb() {
    const p = posts[lbIdx];
    const img = document.getElementById('lb-img');
    const vid = document.getElementById('lb-video');
    if (p.type === 'video') {
      // Block downloading unless it's the viewer's own post
      const own = p.authorId && p.authorId === meId;
      if (own) { vid.removeAttribute('controlslist'); vid.disablePictureInPicture = false; vid.oncontextmenu = null; }
      else { vid.setAttribute('controlslist', 'nodownload noremoteplayback'); vid.disablePictureInPicture = true; vid.oncontextmenu = () => false; }
      img.style.display = 'none'; img.src = '';
      vid.style.display = ''; vid.src = p.mediaData; vid.currentTime = 0; vid.play().catch(() => {});
    } else {
      if (vid) { vid.pause(); vid.style.display = 'none'; vid.src = ''; }
      img.style.display = ''; img.src = p.mediaData;
    }
    document.getElementById('lb-name').textContent = (p.authorName || '') + ' · #' + (p.authorJersey || '—');
    document.getElementById('lb-caption').textContent = p.caption || '';
  }
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') lbNav(-1);
    if (e.key === 'ArrowRight') lbNav(1);
  });

  (async () => {
    try {
      if (typeof _sbSync !== 'function') return;
      await _sbSync({ tournaments: true, posts: true });
      const fresh = matchPosts();
      if (fresh.length !== posts.length) { posts = fresh; renderGrid(); }
    } catch(e) { console.warn('[tournament] Supabase sync error:', e.message); }
  })();
</script>
</body>
</html>
